[project]
name = "content-service"
version = "0.1.0"
description = "Content Service: posts, feeds, likes, comments, reports"
authors = [
    {name = "Social Media Team"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.118.0,<0.119.0)",
    "uvicorn[standard] (>=0.38.0,<0.39.0)",
    "sqlalchemy[asyncio] (>=2.0.43,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.7.0,<3.0.0)",
    "pyjwt[crypto] (>=2.14.0,<3.0.0)",
    "aio-pika (>=10.1.0,<11.0.0)",
    "python-multipart (>=0.0.20,<0.1.0)",
    "pillow (>=11.0.0,<13.0.0)",
    "httpx (>=0.27.0,<0.29.0)",
    "minio (>=7.2.0,<8.0.0)",
]

[tool.poetry]
packages = [
    { include = "content_service", from = "src" }
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<9.0.0"
pytest-asyncio = ">=0.24.0,<0.25.0"
ruff = ">=0.8.0,<0.9.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
